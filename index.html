<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <title>Adventure of the Fairy</title>
</head>
<body>
  <div id="overlay" class="visible">
    <h1 id="modal-title">Adventure of the Fairy</h1>
    <p id="modal-message">Pop bubbles to free fairies!</p>
    <button id="start-btn">Start Game</button>
    <button id="lang-toggle">EN / UR / HI</button>
  </div>

  <div id="hud">
    <div><span data-key="level">Level</span>: <span id="level">1</span></div>
    <div><span data-key="score">Score</span>: <span id="score">0</span></div>
    <div>Time: <span id="timer">0s</span></div>
    <div><span data-key="lives">Lives</span>: <span id="lives">5</span></div>
  </div>

  <div id="play-area"></div>
</body>
</html>
